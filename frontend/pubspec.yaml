name: frontend
description: "A new Flutter project."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  permission_handler: ^11.0.1
  geolocator: ^9.0.2
  geocoding: ^2.2.1
  http: ^1.4.0
  intl: ^0.18.0
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  camera: ^0.10.5+4
  path_provider: ^2.1.2
  path: ^1.8.3
  percent_indicator: ^4.2.5
  google_fonts: ^6.2.1
  google_mobile_ads: ^6.0.0
  shared_preferences: ^2.2.3
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  google_sign_in: ^6.3.0
  flutter_dotenv: ^5.1.0
  webview_flutter: ^4.9.0
  image_picker: ^1.1.0 # カメラ・ギャラリーアクセス用
  web_socket_channel: ^2.4.0 # WebSocket通信用
  cached_network_image: ^3.3.1 # 画像キャッシュ表示用

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
    - .env
